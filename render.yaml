services:
  - type: web
    name: chaudhary-samaj-api
    env: node
    rootDir: .
    plan: free
    buildCommand: npm install
    startCommand: npm run server
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: 20
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        sync: false
      # Photo storage. Without both of these the API writes uploads to local
      # disk, which Render wipes on every deploy.
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      # Absolute origin of this service, used for photo URLs and the Razorpay
      # return callback.
      - key: PUBLIC_API_BASE_URL
        sync: false
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      # Session signing key. The process EXITS on boot without this
      # (min 32 chars) — a predictable secret would let anyone mint a token.
      - key: JWT_SECRET
        sync: false
      # Comma-separated browser origins allowed to call the API. Browser calls
      # from the web app and admin dashboard are blocked when unset.
      - key: ALLOWED_ORIGINS
        sync: false
      # Google Play subscriptions. Without these, /payments/play/* returns 503.
      - key: PLAY_PACKAGE_NAME
        value: com.chaudharysamaj.mobile
      - key: PLAY_SERVICE_ACCOUNT_JSON
        sync: false
      - key: PLAY_RTDN_TOKEN
        sync: false
      # Google Play review account. Lets one address sign in with a fixed
      # code so a reviewer can get past the emailed OTP. Unset = off.
      - key: REVIEW_ACCOUNT_EMAIL
        sync: false
      - key: REVIEW_ACCOUNT_OTP
        sync: false
      # SMS OTP. Without these, phone sign-in returns 503 in production
      # rather than handing the code back to the caller.
      - key: MSG91_AUTHKEY
        sync: false
      - key: MSG91_TEMPLATE_ID
        sync: false
      - key: MSG91_SENDERID
        sync: false
      # Email OTP. Prefer BREVO_API_KEY: Render's free tier blocks outbound
      # SMTP on ports 25/465/587, so the SMTP vars below cannot connect here
      # and are kept only for local/other-host use.
      - key: BREVO_API_KEY
        sync: false
      - key: SMTP_HOST
        sync: false
      - key: SMTP_SERVICE
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASS
        sync: false
      - key: SMTP_FROM
        sync: false

  # Public website: the landing page and privacy policy.
  #
  # A separate static site because custom domains are not available on free
  # web services, but they are free on static sites — so a real domain can
  # point here without paying to upgrade the API. The same pages are also
  # served by the API itself, so both URLs work.
  - type: web
    name: chaudhary-samaj-site
    runtime: static
    rootDir: site
    buildCommand: ""
    staticPublishPath: .
    routes:
      - type: rewrite
        source: /privacy-policy
        destination: /privacy-policy.html
      - type: rewrite
        source: /privacy
        destination: /privacy-policy.html
